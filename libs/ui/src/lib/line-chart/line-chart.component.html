@if (showDateRangeSelector) {
  <gf-toggle
    class="date-range-selector d-block mb-2 text-center"
    [defaultValue]="dateRange"
    [isLoading]="false"
    [options]="dateRangeOptions"
    (valueChange)="onDateRangeChange($event.value)"
  />
}
@if (isLoading && showLoader) {
  <ngx-skeleton-loader
    animation="pulse"
    [theme]="{
      height: '100%',
      width: '100%'
    }"
  />
}
<canvas #chartCanvas [style.display]="isLoading ? 'none' : 'block'"></canvas>
